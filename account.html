<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script>
      /* Measurement, added 7 Sep 2026. These same files are served by the dev
         server and by Vercel preview builds, and counting those would mix
         Varakorn's own sessions into the real numbers. The test is a list of
         places NOT to measure, so a new host counts by default rather than
         going quietly missing. */
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      if (
        !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) &&
        !location.hostname.endsWith('.vercel.app') &&
        !location.hostname.endsWith('.workers.dev') &&
        !location.hostname.endsWith('.pages.dev')
      ) {
        var gt = document.createElement('script');
        gt.async = true;
        gt.src = 'https://www.googletagmanager.com/gtag/js?id=G-FGY4YXBKBQ';
        document.head.appendChild(gt);
        gtag('js', new Date());
        gtag('config', 'G-FGY4YXBKBQ');
      }
    </script>
    <title>Your Account · Varakorn</title>
    <meta name="description" content="Your account on Varakorn's site: passport stamps, comments and vouches." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#225cc8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/retro/desktop.css" />
    <script type="module" src="/src/retro/system.js"></script>
  </head>
